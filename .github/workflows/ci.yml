name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/calibration/requirements-dev.txt
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y jq rsync zip
      - name: Install Python dependencies
        run: python -m pip install --requirement tools/calibration/requirements-dev.txt
      - name: Schema examples
        run: python tools/schema_check.py
      - name: Full release validation
        run: ./scripts/validate_release.sh
      - name: Check source package
        run: ./scripts/package.sh
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            VALIDATION_REPORT.md
            artifacts/validation/full.log
            artifacts/adversarial-results.tsv
          if-no-files-found: warn
